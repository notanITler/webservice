  <text x="95" y="255" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#9fc5e8">ELEKTROTECHNIK AUS EINER HAND</text><text x="95" y="340" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#fff">Strom, der</text><text x="95" y="405" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#fff">zu Ihnen passt.</text><text x="95" y="455" font-family="Arial, sans-serif" font-size="22" fill="#c5dcec">Installation, Modernisierung und Service für Ihr Zuhause.</text><rect x="95" y="475" width="210" height="50" rx="6" fill="#f0b43c"/><text x="122" y="507" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172d43">Projekt anfragen  →</text>
  <rect x="45" y="525" width="1110" height="180" fill="#fff"/><text x="95" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2d7ac3">UNSERE LEISTUNGEN</text><text x="95" y="625" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173856">Elektroinstallation</text><text x="405" y="625" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173856">Smart Home</text><text x="700" y="625" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173856">E-Mobilität</text><text x="95" y="660" font-family="Arial, sans-serif" font-size="17" fill="#64798c">Planbar. Sicher. Sauber umgesetzt.</text><text x="405" y="660" font-family="Arial, sans-serif" font-size="17" fill="#64798c">Technik, die den Alltag erleichtert.</text><text x="700" y="660" font-family="Arial, sans-serif" font-size="17" fill="#64798c">Zukunftsfähig unterwegs.</text>
