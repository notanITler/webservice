  <rect x="45" y="93" width="1110" height="82" fill="#fffdf9"/><text x="95" y="135" font-family="Georgia, serif" font-size="28" fill="#50695d">Praxis <tspan font-weight="700">am Park</tspan></text><text x="95" y="157" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#9a8273">PHYSIOTHERAPIE</text><text x="705" y="140" font-family="Arial, sans-serif" font-size="18" fill="#6d746e">Behandlungen</text><text x="860" y="140" font-family="Arial, sans-serif" font-size="18" fill="#6d746e">Praxis</text><rect x="972" y="115" width="128" height="40" rx="20" fill="#c88067"/><text x="995" y="141" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Termin</text>
  <rect x="45" y="175" width="1110" height="340" fill="#e8eee6"/><circle cx="940" cy="345" r="210" fill="#c8d8cc"/><path d="M880 440c48-122 125-186 227-198-9 107-80 190-227 198z" fill="#839f8e"/><path d="M810 430c15-120 76-199 186-239 32 111-21 204-186 239z" fill="#a7c2ae"/>
  <text x="95" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#8a7467">ZEIT FÜR BEWEGUNG</text><text x="95" y="330" font-family="Georgia, serif" font-size="60" fill="#3f5e4e">Gut begleitet.</text><text x="95" y="398" font-family="Georgia, serif" font-size="60" fill="#3f5e4e">Schritt für Schritt.</text><text x="95" y="445" font-family="Arial, sans-serif" font-size="21" fill="#65756c">Physiotherapie mit Zeit, Aufmerksamkeit und einem klaren Plan.</text><rect x="95" y="465" width="188" height="48" rx="24" fill="#c88067"/><text x="120" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Termin vereinbaren</text>
  <rect x="45" y="515" width="1110" height="190" fill="#fffdf9"/><text x="95" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a8273">WAS WIR ANBIETEN</text><text x="95" y="620" font-family="Georgia, serif" font-size="28" fill="#50695d">Krankengymnastik</text><text x="415" y="620" font-family="Georgia, serif" font-size="28" fill="#50695d">Manuelle Therapie</text><text x="770" y="620" font-family="Georgia, serif" font-size="28" fill="#50695d">Prävention</text><text x="95" y="658" font-family="Arial, sans-serif" font-size="17" fill="#747c76">Wieder besser in Bewegung kommen.</text><text x="415" y="658" font-family="Arial, sans-serif" font-size="17" fill="#747c76">Beschwerden gezielt behandeln.</text><text x="770" y="658" font-family="Arial, sans-serif" font-size="17" fill="#747c76">Beweglich bleiben im Alltag.</text>
