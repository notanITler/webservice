<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Website-Entwurf für Praxis am Park</title><desc id="desc">Heller, ruhiger Website-Entwurf für eine physiotherapeutische Praxis.</desc>
